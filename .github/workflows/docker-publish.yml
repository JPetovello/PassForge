name: Build, Scan, and Push Docker Image

on:
  push:
    branches:
      - main
    tags:
      - 'v*'
  workflow_dispatch:

jobs:
  build-and-push:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.13'

      - name: Run Bandit (Python Security Linter)
        run: |
          pip install bandit
          bandit -r . -c .bandit -x ./venv,./tests

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v3

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Determine Docker Tags and Version
        id: tags
        run: |
          VERSION=$(git describe --tags --always 2>/dev/null || echo "${{ github.ref_name }}")
          if [ -z "$VERSION" ] || [ "$VERSION" = "main" ]; then
            VERSION="latest"
          fi

          if [[ "${{ github.ref }}" == refs/heads/main ]]; then
            echo "TAGS=hardly007/password-checker-web:latest,hardly007/password-checker-web:${VERSION}" >> $GITHUB_ENV
          else
            echo "TAGS=hardly007/password-checker-web:latest,hardly007/password-checker-web:${{ github.ref_name }}" >> $GITHUB_ENV
            VERSION="${{ github.ref_name }}"
          fi

          echo "VERSION=${VERSION}" >> $GITHUB_ENV

      - name: Build and push Docker image
        uses: docker/build-push-action@v6
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ env.TAGS }}
          build-args: |
            APP_VERSION=${{ env.VERSION }}

      - name: Sync README to Docker Hub
        uses: peter-evans/dockerhub-description@v4
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}
          repository: hardly007/password-checker-web
          readme-filepath: README.md
